services:
  postgres:
    image: pgvector/pgvector:pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    environment:
      POSTGRES_USER: lobu
      POSTGRES_DB: lobu
      # Disposable local database; reachable only inside the Compose network.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ontology_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lobu -d lobu']
      interval: 5s
      timeout: 3s
      retries: 30
  runtime:
    image: ghcr.io/lobu-ai/lobu-app@sha256:3601f581ddf6dfda595a930170d078ee112182bd30a80ec3769faac8f4efc681
    command:
      ['sh', '-c', 'socat TCP-LISTEN:8788,fork,reuseaddr TCP:127.0.0.1:8787 & exec /app/start.sh']
    env_file: .runtime/runtime.env
    environment:
      HOST: 127.0.0.1
      PORT: '8787'
      DATABASE_URL: postgresql://lobu@postgres:5432/lobu?sslmode=disable
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
      # This loopback-only disposable stack owns its database and local operator.
      LOBU_RUN_OWNS_DB: '1'
      LOBU_LOCAL_INIT_ALLOW_PROXY: '0'
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 4g
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 40
      start_period: 20s
  gateway:
    image: nginx:1.28-alpine
    ports:
      - '127.0.0.1:8787:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      runtime:
        condition: service_healthy
volumes:
  ontology_pgdata:
